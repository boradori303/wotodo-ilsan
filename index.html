<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>와투두 일산 — 우리 동네 혜택</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F8F1E4">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="와투두 일산">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F1E4; --card:#FFFDF9; --ink:#2E221B; --sub:#6B584C; --line:#EADFCF; --line2:#DCCDB8;
  --brown:#2E221B; --brown-soft:#EFE4D3; --pop:#D2541F; --pop-soft:#FFE6DA; --pop-ink:#A93E10;
  --gold:#F2B544; --ok:#2F7A55; --ok-soft:#E3F1E8; --warn:#B8381F; --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 110px}
.display{font-weight:700;letter-spacing:-.03em}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(248,241,228,.92);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:space-between;padding:12px 18px;max-width:520px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.brand .display{font-size:22px;color:var(--brown)}
.brand b{color:var(--pop);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);
  border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.pill .n{background:var(--pop);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;line-height:18px}
.back{border:0;background:none;font-size:15px;font-weight:600;padding:6px 0;display:flex;align-items:center;gap:4px}

/* banners */
.banner{border-radius:var(--r);padding:14px 16px;margin:10px 0;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5}
.banner .ico{font-size:22px;line-height:1}
.banner.demo{background:#FFF6D9;border:1.5px dashed #E5C55B}
.banner.notice{background:var(--brown);color:#FBF6EE}
.banner.welcome{background:var(--pop-soft);border:1.5px solid #FFC9AE}
.banner strong{display:block;font-size:15px}

/* hero */
.hero{padding:18px 2px 8px}
.hero h1{margin:0;font-size:32px;line-height:1.2;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--pop)}
.hero p{margin:8px 0 0;color:var(--sub);font-size:15px}

/* search + chips */
.search{position:relative;margin:14px 0 10px}
.search input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px 13px 42px;font-size:15px;outline:none}
.search input:focus{border-color:var(--brown)}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{font-size:14px;color:var(--sub);margin:12px 2px 6px}

/* store cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r);padding:14px;transition:transform .12s}
.card:active{transform:scale(.985)}
.emo{flex:0 0 54px;height:54px;border-radius:16px;background:var(--brown-soft);display:grid;place-items:center;font-size:28px}
.info{flex:1;min-width:0}
.name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--sub);margin-top:2px}
.deal{margin-top:6px;font-size:14px;font-weight:600;color:var(--pop);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nodeal{margin-top:6px;font-size:13px;color:var(--sub)}
.badge{flex:0 0 auto;font-size:12px;font-weight:700;border-radius:999px;padding:5px 9px;background:var(--pop-soft);color:var(--pop)}
.badge.gray{background:#F0ECE7;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:15px;line-height:1.6}

/* sheet / modal */
.overlay{position:fixed;inset:0;background:rgba(40,25,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 20px 28px;transform:translateY(30px);transition:transform .2s}
.overlay.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0;font-size:24px}
.sheet .sub{color:var(--sub);font-size:14px;margin-top:4px}
.kv{font-size:14px;line-height:1.7;margin:12px 0;color:var(--ink)}
.kv div{display:flex;gap:8px}
.kv span:first-child{flex:0 0 18px}
.intro{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;border:1.5px solid var(--line)}

.offer{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.kind{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--brown-soft);color:var(--brown)}
.kind.discount{background:#E7EEFB;color:#3559A8}
.ot{font-weight:700;font-size:17px;margin-top:8px}
.od{font-size:14px;color:var(--sub);margin-top:3px;line-height:1.5}
.bar{height:7px;border-radius:9px;background:#F0E8DF;margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pop);border-radius:9px}
.left{font-size:13px;color:var(--sub)}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--brown);color:#fff;margin-top:12px}
.btn.pop{background:var(--pop)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.done{background:var(--ok-soft);color:var(--ok)}
.btn:disabled{background:#E6DED6;color:#A8988C}
.btn.sm{display:inline-block;width:auto;padding:9px 13px;font-size:14px;margin:0;border-radius:11px}
.btn.danger{background:#FBE9E5;color:var(--warn)}
.linkbtn{border:0;background:none;color:var(--sub);font-size:14px;text-decoration:underline;padding:8px}

/* forms */
label.f{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.in{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
.in:focus{border-color:var(--brown)}
textarea.in{min-height:76px;resize:vertical}
.hint{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.5}
.seg{display:flex;background:var(--brown-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.check{display:flex;gap:10px;align-items:center;font-size:15px;margin:14px 0}
.check input{width:20px;height:20px;accent-color:var(--brown)}
.err{color:var(--warn);font-size:14px;margin-top:10px;min-height:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* coupons */
.ticket{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:10px}
.ticket .l{flex:0 0 74px;background:var(--pop);display:grid;place-items:center;font-size:30px;position:relative}
.ticket .l::after{content:"";position:absolute;right:-8px;top:0;bottom:0;width:16px;
  background:radial-gradient(circle at 8px 10px,var(--card) 5px,transparent 6px) 0 0/16px 20px repeat-y}
.ticket .r{flex:1;padding:14px 14px 14px 18px;min-width:0}
.ticket.used .l{background:#CFC4BA}
.ticket.used{opacity:.75}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.12em;color:var(--sub)}
.stamp{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--ok);border:2px solid var(--ok);border-radius:8px;padding:2px 8px;transform:rotate(-3deg)}
.bigcode{font-family:ui-monospace,Menlo,monospace;font-size:38px;font-weight:700;letter-spacing:.2em;text-align:center;margin:14px 0 4px;color:var(--brown)}
.staff{background:var(--brown);color:#FBF6EE;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55;margin-top:14px}

/* owner */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-family:'Jua',sans-serif;font-weight:400;color:var(--brown)}
.stat span{font-size:12px;color:var(--sub)}
.ocard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-top:10px}
.ocard.on{border-color:var(--pop);box-shadow:0 0 0 3px var(--pop-soft)}
.ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.switch{position:relative;flex:0 0 auto;width:74px;height:38px;border-radius:999px;border:0;background:#DCD2C8;transition:background .15s;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch span{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:#fff}
.switch .on{left:12px;opacity:0}.switch .off{right:10px}
.switch.is-on{background:var(--pop)}
.switch.is-on::after{left:40px}
.switch.is-on .on{opacity:1}.switch.is-on .off{opacity:0}
.oacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.section-t{font-size:17px;font-weight:700;margin:26px 2px 6px}
.rec{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:10px 2px;border-bottom:1px solid var(--line)}
.rec small{color:var(--sub)}
.tag-ok{color:var(--ok);font-weight:700}.tag-wait{color:var(--sub)}
details.box{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-top:10px}
details.box summary{font-weight:700;cursor:pointer;list-style:none}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:"＋";float:right;color:var(--sub)}
details.box[open] summary::after{content:"－"}

/* gate */
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 4px}
.gate h1{font-size:34px;margin:16px 0 6px;line-height:1.2}
.gate p{color:var(--sub);margin:0 0 6px;line-height:1.6}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .2s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;margin-top:34px;font-size:13px;color:var(--sub);line-height:2}
.foot a{color:var(--sub)}
.spin{text-align:center;padding:50px;color:var(--sub)}
.qrbox{background:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px;border:1.5px solid var(--line)}
.banner.install{background:var(--card);border:1.5px solid var(--line);align-items:center}
.banner.install .grow{flex:1}
.banner.install .x{border:0;background:none;font-size:22px;color:var(--sub);padding:0 4px;line-height:1}
.step{display:flex;gap:12px;align-items:flex-start;margin:14px 0;font-size:15px;line-height:1.55}
.step .num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.kbd{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:1px 7px;font-weight:600;font-size:14px;vertical-align:middle}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all;background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--ink)}
/* ===================== 손님 화면 (새 디자인) ===================== */
.cw{max-width:520px;margin:0 auto;padding:0 20px 120px}
.chead{display:flex;justify-content:space-between;align-items:center;height:60px;position:sticky;top:0;z-index:20;background:rgba(248,241,228,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:0 -20px;padding:0 20px}
.dongbtn{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0;font-size:19px;font-weight:700;letter-spacing:-.03em}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;text-decoration:none;color:var(--ink);flex:0 0 auto;padding:0}
.ibtn.float{border:0;box-shadow:0 2px 10px rgba(46,34,27,.14)}
.notice-card{margin-top:6px;background:var(--ink);color:#F8F1E4;border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:12px;overflow:hidden}
.notice-card .k{font-size:12px;font-weight:600;color:var(--gold)}
.notice-card .t{font-size:16px;font-weight:700;margin-top:4px;letter-spacing:-.02em;line-height:1.4}
.notice-card .s{font-size:13px;color:#CDBBA8;margin-top:4px}
.notice-card img{width:84px;flex:0 0 auto;margin-right:-6px}
.chips2{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px -20px 0;padding:0 20px 4px}
.chips2::-webkit-scrollbar{display:none}
.chip2{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:14px;font-weight:500;color:var(--ink)}
.chip2.on{background:var(--ink);border-color:var(--ink);color:#FFFDF9;font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px;gap:10px}
.sec h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
.sec span{font-size:13px;color:var(--sub)}
.slist{display:flex;flex-direction:column;gap:10px}
.sitem{position:relative}
.scard{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-decoration:none;color:var(--ink);transition:transform .12s}
.scard:active{transform:scale(.985)}
.ci{display:grid;place-items:center;flex:0 0 auto}
.sname{font-size:15px;font-weight:700;letter-spacing:-.02em;padding-right:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta{font-size:12px;color:var(--sub);margin-top:2px}
.sdeal{display:flex;align-items:center;gap:8px;margin-top:8px;min-width:0}
.sdeal b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdeal .none{font-size:13px;color:var(--sub)}
.pill-left{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--pop-ink);background:var(--pop-soft);border-radius:8px;padding:3px 7px}
.pill-left.gray{color:var(--sub);background:var(--brown-soft)}
.heart{position:absolute;top:6px;right:6px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:64px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--sub);text-decoration:none;position:relative}
.tab.on{color:var(--ink);font-weight:700}
.tab .n{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pop);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.onb{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px 0 28px}
.onb h1{margin:20px 0 0;font-size:30px;line-height:1.28;font-weight:700;letter-spacing:-.035em}
.onb h1 em{font-style:normal;color:var(--pop)}
.onb .lead{margin:10px 0 0;font-size:15px;line-height:1.6;color:var(--sub)}
.ostep{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45}
.ostep i{flex:0 0 32px;height:32px;border-radius:10px;background:var(--ink);color:#F8F1E4;display:grid;place-items:center;font-size:13px;font-weight:700;font-style:normal}
.sel{position:relative}
.sel select{width:100%;appearance:none;-webkit-appearance:none;height:52px;border-radius:14px;border:1px solid var(--line2);background:var(--card);padding:0 44px 0 16px;font-size:16px}
.sel svg{position:absolute;right:16px;top:17px;pointer-events:none}
.bigbtn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border:0;border-radius:16px;background:var(--ink);color:#FFFDF9;font-size:16px;font-weight:700;letter-spacing:-.01em;text-decoration:none}
.bigbtn:disabled{background:#E2D8CC;color:#8A7568}
.shero{height:176px;position:relative;display:grid;place-items:center}
.shero .bar3{position:absolute;left:16px;right:16px;top:16px;display:flex;justify-content:space-between;max-width:488px;margin:0 auto}
.sbody{max-width:520px;margin:-22px auto 0;position:relative;background:var(--bg);border-radius:24px 24px 0 0;padding:22px 20px 140px}
.sbody h1{margin:4px 0 0;font-size:24px;font-weight:700;letter-spacing:-.03em}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.act{height:64px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;padding:0}
.ocd{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:10px}
.ocd.main{border:1.5px solid var(--ink)}
.otag{display:inline-block;font-size:12px;font-weight:700;border-radius:7px;padding:3px 8px;color:#F8F1E4;background:var(--ink)}
.otag.discount{color:#2F4F8F;background:#E4EBF8}
.obtn{flex:0 0 auto;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--ink);background:var(--card);font-size:13px;font-weight:700;color:var(--ink)}
.obtn.done{border-color:var(--ok);color:var(--ok)}
.obtn:disabled{border-color:var(--line2);color:#8A7568}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(248,241,228,0))}
.sticky-cta .bigbtn{max-width:488px;margin:0 auto}
.mapwrap{position:fixed;inset:0;background:#EEE5D5}
#lmap{position:absolute;inset:0}
.leaflet-tile-pane{filter:sepia(.22) saturate(.85) brightness(1.03)}
.leaflet-div-icon{background:none;border:0}
.mtop{position:absolute;left:12px;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto}
.msearch{flex:1;height:44px;border-radius:14px;background:var(--card);display:flex;align-items:center;gap:8px;padding:0 14px;box-shadow:0 2px 10px rgba(46,34,27,.14)}
.msearch input{border:0;outline:none;background:none;font-size:15px;width:100%}
.mchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}

  // 일산 안에 있을 때만 쿠폰 받기 (휴대폰 위치 확인, 서버로 보내지 않음)

  network:'인터넷 연결을 확인하고 다시 시도해주세요'
};

/* ---------- 도우미 ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk = st => ({
  get(k,d){ try{ const v=st().getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ st().setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ st().removeItem(k);}catch(e){} }
});
const LS = mk(()=>localStorage), SS = mk(()=>sessionStorage);
const todayKST = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const fmtDate = iso => { if(!iso) return ''; const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const fmtDay = ymd => { if(!ymd) return ''; const [y,m,d]=ymd.split('-'); return `${+m}/${+d}`; };
const errMsg = r => ERR[r && r.error] || (r && r.error) || '문제가 생겼어요. 다시 시도해주세요';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2400); }
function openSheet(html){ $('#sheet').innerHTML='<div class="grab"></div>'+html; $('#overlay').classList.add('open'); }
function closeSheet(){ $('#overlay').classList.remove('open'); }
$('#overlay').addEventListener('click', e => { if(e.target.id==='overlay') closeSheet(); });

let DEVICE = LS.get('il_device');
if(!DEVICE){ DEVICE = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)); LS.set('il_device', DEVICE); }

const MOLE = (w=40) => `<img src="mole.png" alt="" width="${w}" style="height:auto;display:inline-block;vertical-align:middle">`;

/* =====================================================================
   데이터 연결: Supabase(실제 운영) 또는 체험 모드
   ===================================================================== */
const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);

async function rpc(fn, args){
  const h = {'Content-Type':'application/json', apikey: CONFIG.SUPABASE_KEY};
  if(CONFIG.SUPABASE_KEY.startsWith('eyJ')) h.Authorization = 'Bearer '+CONFIG.SUPABASE_KEY;
  try{
    const r = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn, {method:'POST', headers:h, body:JSON.stringify(args||{})});
    if(!r.ok) return {ok:false, error:'network'};
    return await r.json();
  }catch(e){ return {ok:false, error:'network'}; }
}

const Live = {
  publicData:      ()        => rpc('il_public_data'),
  claim:           id        => rpc('il_claim', {p_offer:id, p_device:DEVICE}),
  myClaims:        ()        => rpc('il_my_claims', {p_device:DEVICE}),
  redeem:          (id,pin)  => rpc('il_redeem', {p_claim:id, p_device:DEVICE, p_pin:pin}),
  logScan:         (src,spot)=> rpc('il_log_scan', {p_src:src, p_spot:spot}),
  ownerData:       (c,p)     => rpc('il_owner_data', {p_code:c, p_pin:p}),
  ownerSaveOffer:  (c,p,o)   => rpc('il_owner_save_offer', {p_code:c, p_pin:p, p:o}),
  ownerToggle:     (c,p,id,on)=>rpc('il_owner_toggle', {p_code:c, p_pin:p, p_id:id, p_on:on}),
  ownerDeleteOffer:(c,p,id)  => rpc('il_owner_delete_offer', {p_code:c, p_pin:p, p_id:id}),
  ownerSaveStore:  (c,p,s)   => rpc('il_owner_save_store', {p_code:c, p_pin:p, p:s}),
  adminData:       pw        => rpc('il_admin_data', {p_pw:pw}),
  adminSaveStore:  (pw,s)    => rpc('il_admin_save_store', {p_pw:pw, p:s}),
  adminDeleteStore:(pw,id)   => rpc('il_admin_delete_store', {p_pw:pw, p_id:id}),
  adminSetNotice:  (pw,t)    => rpc('il_admin_set_notice', {p_pw:pw, p_text:t})
};

/* 체험 모드: Supabase 함수와 똑같이 동작하는 브라우저 내 가짜 서버 */
const Demo = (() => {
  const KEY = 'il_demo_db_v2';
  const seed = () => {
    const S = (id,code,name,category,area,emoji,intro,hours,address,lat,lng) => ({id,code,pin:'1234',name,category,area,emoji,intro,hours,address,map_url:'',active:true,fail:0,locked_until:0,lat,lng});
    const O = (id,store_id,kind,title,detail,total_qty,claimed,is_on) => ({id,store_id,kind,title,detail,total_qty,claimed,is_on,ends_at:null});
    return { seq:100, admin:'demo',
      notice:'(예시) 이번 주 토요일 오후 3~5시, 라페스타 광장에 와투두 두더지가 나타나요!',
      stores:[
        S(1,'cafe01','정발산 골목 로스터리 (예시)','카페','정발산·마두','☕','직접 볶은 원두로 내리는 동네 카페예요.','10:00–21:00 (월 휴무)','고양시 일산동구 (예시 주소)',37.6662,126.7735),
        S(2,'snack01','라페스타 떡볶이 (예시)','분식','라페스타·웨스턴돔','🍢','학교 앞 그 맛, 쌀떡볶이 전문.','11:00–22:00','고양시 일산동구 (예시 주소)',37.6598,126.7708),
        S(3,'flower01','주엽 꽃 한 송이 (예시)','꽃·소품','주엽·대화','💐','오늘 기분에 맞는 꽃 한 송이 골라드려요.','11:00–20:00','고양시 일산서구 (예시 주소)',37.6712,126.7582),
        S(4,'nail01','백석 네일 스튜디오 (예시)','뷰티','백석·장항','💅','1인 예약제 네일샵.','12:00–21:00 (예약제)','고양시 일산동구 (예시 주소)',37.6436,126.7880),
        S(5,'food01','일산시장 국밥 (예시)','식당','일산시장·일산동','🍲','새벽부터 끓인 돼지국밥.','07:00–20:00','고양시 일산서구 (예시 주소)',null,null)
      ],
      offers:[
        O(11,1,'coupon','아메리카노 1+1','매장 이용 시 · 1인 1회',10,3,true),
        O(12,1,'discount','디저트 20% 할인','음료와 함께 주문 시',15,0,false),
        O(21,2,'coupon','튀김 1인분 서비스','떡볶이 주문 시',5,5,true),
        O(31,3,'coupon','미니 꽃 한 송이 증정','1만원 이상 구매 시',20,4,true),
        O(51,5,'discount','국밥 1,000원 할인','점심(11–14시) 제외',30,12,true)
      ], claims:[], scans:[] };
  };
  let db = LS.get(KEY) || seed();
  const save = () => LS.set(KEY, db);
  const R = v => Promise.resolve(JSON.parse(JSON.stringify(v)));
  const ok = (o={}) => R({ok:true, ...o}), err = e => R({ok:false, error:e});
  const live = o => o.is_on && (!o.ends_at || o.ends_at >= todayKST());
  const st = id => db.stores.find(s=>s.id===id), of = id => db.offers.find(o=>o.id===id);
  function pinOk(sid, pin){
    const s = st(sid); if(!s) return 0;
    if(s.locked_until && s.locked_until > Date.now()) return -1;
    if(s.pin === String(pin||'')){ s.fail=0; save(); return 1; }
    s.fail=(s.fail||0)+1; if(s.fail>=10){ s.fail=0; s.locked_until=Date.now()+600e3; } save(); return 0;
  }
  function auth(code,pin){
    const s = db.stores.find(x=>x.code===String(code||'').trim().toLowerCase()); if(!s) return null;
    const r = pinOk(s.id,pin); return r===1 ? s.id : (r===-1 ? -1 : null);
  }
  const authErr = sid => sid==null ? 'login_failed' : (sid<0 ? 'locked' : null);
  const pubS = s => ({id:s.id,name:s.name,category:s.category,area:s.area,address:s.address,hours:s.hours,intro:s.intro,map_url:s.map_url,emoji:s.emoji,lat:s.lat??null,lng:s.lng??null});
  const pubO = o => ({id:o.id,kind:o.kind,title:o.title,detail:o.detail,total_qty:o.total_qty,claimed:o.claimed,ends_at:o.ends_at});
  const isAdmin = pw => pw === db.admin;
  return {
    publicData(){ return R({notice:db.notice, stores: db.stores.filter(s=>s.active).sort((a,b)=>a.name.localeCompare(b.name,'ko'))
      .map(s=>({...pubS(s), offers: db.offers.filter(o=>o.store_id===s.id && live(o)).sort((a,b)=>a.id-b.id).map(pubO)}))}); },
    claim(id){
      const ex = db.claims.find(c=>c.offer_id===id && c.device_id===DEVICE); if(ex) return ok({already:true, claim_id:ex.id});
      const o = of(id), s = o && st(o.store_id);
      if(!o || !s || !s.active || !live(o)) return err('off');
      if(o.claimed >= o.total_qty) return err('sold_out');
      o.claimed++;
      const c = {id:++db.seq, offer_id:id, device_id:DEVICE, code:Math.random().toString(16).slice(2,8).toUpperCase(), claimed_at:new Date().toISOString(), used_at:null};
      db.claims.push(c); save(); return ok({claim_id:c.id});
    },
    myClaims(){ return R(db.claims.filter(c=>c.device_id===DEVICE).sort((a,b)=>b.claimed_at.localeCompare(a.claimed_at)).map(c=>{
      const o=of(c.offer_id)||{}, s=st(o.store_id)||{};
      return {id:c.id, offer_id:c.offer_id, code:c.code, claimed_at:c.claimed_at, used_at:c.used_at, offer_title:o.title, offer_detail:o.detail, kind:o.kind, ends_at:o.ends_at, store_id:s.id, store_name:s.name, store_emoji:s.emoji, area:s.area}; })); },
    redeem(id,pin){
      const c = db.claims.find(x=>x.id===id && x.device_id===DEVICE); if(!c) return err('not_found');
      if(c.used_at) return err('already_used');
      const o = of(c.offer_id); if(o.ends_at && o.ends_at < todayKST()) return err('expired');
      const r = pinOk(o.store_id,pin); if(r===-1) return err('locked'); if(r===0) return err('wrong_pin');
      c.used_at = new Date().toISOString(); save(); return ok();
    },
    logScan(src,spot){ db.scans.push({src,spot,at:new Date().toISOString()}); save(); return ok(); },
    ownerData(code,pin){
      const sid = auth(code,pin), e = authErr(sid); if(e) return err(e);
      const s = st(sid), mine = db.claims.filter(c=>{ const o=of(c.offer_id); return o && o.store_id===sid; });
      return ok({ store:{...pubS(s), code:s.code, active:s.active},
        offers: db.offers.filter(o=>o.store_id===sid).sort((a,b)=>b.id-a.id).map(o=>({...pubO(o), is_on:o.is_on, used: db.claims.filter(c=>c.offer_id===o.id && c.used_at).length})),
        recent: mine.sort((a,b)=>(b.used_at||b.claimed_at).localeCompare(a.used_at||a.claimed_at)).slice(0,30).map(c=>({code:c.code, claimed_at:c.claimed_at, used_at:c.used_at, title:(of(c.offer_id)||{}).title})) });
    },
    ownerSaveOffer(code,pin,p){
      const sid = auth(code,pin), e = authErr(sid); if(e) return err(e);
      if(!String(p.title||'').trim()) return err('title_required');
      const q = Math.max(0, Math.min(100000, parseInt(p.total_qty)||0)), k = p.kind==='discount'?'discount':'coupon';
      if(!p.id){
        const o = {id:++db.seq, store_id:sid, kind:k, title:String(p.title).trim().slice(0,60), detail:String(p.detail||'').slice(0,300), total_qty:q, claimed:0, is_on:!!p.is_on, ends_at:p.ends_at||null};
        db.offers.push(o); save(); return ok({id:o.id});
      }
      const o = of(+p.id); if(!o || o.store_id!==sid) return err('not_found');
      if(q < o.claimed) return err('qty_below_claimed');
      Object.assign(o, {kind:k, title:String(p.title).trim().slice(0,60), detail:String(p.detail||'').slice(0,300), total_qty:q, ends_at:p.ends_at||null});
      if(typeof p.is_on === 'boolean') o.is_on = p.is_on;
      save(); return ok({id:o.id});
    },
    ownerToggle(code,pin,id,on){ const sid=auth(code,pin), e=authErr(sid); if(e) return err(e); const o=of(id); if(!o||o.store_id!==sid) return err('not_found'); o.is_on=!!on; save(); return ok(); },
    ownerDeleteOffer(code,pin,id){
      const sid=auth(code,pin), e=authErr(sid); if(e) return err(e);
      if(db.claims.some(c=>c.offer_id===id && !c.used_at)) return err('has_unused');
      db.offers = db.offers.filter(o=>!(o.id===id && o.store_id===sid)); db.claims = db.claims.filter(c=>c.offer_id!==id); save(); return ok();
    },
    ownerSaveStore(code,pin,p){ const sid=auth(code,pin), e=authErr(sid); if(e) return err(e); const s=st(sid); if(p.intro!=null) s.intro=String(p.intro).slice(0,300); if(p.hours!=null) s.hours=String(p.hours).slice(0,100); save(); return ok(); },
    adminData(pw){
      if(!isAdmin(pw)) return err('admin_failed');
      const by = {}; db.scans.forEach(x=>{ const k=x.spot||'(위치 없음)'; by[k]=(by[k]||0)+1; });
      return ok({ notice:db.notice,
        stores: db.stores.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(s=>({...pubS(s), code:s.code, active:s.active, offer_count:db.offers.filter(o=>o.store_id===s.id).length, on_count:db.offers.filter(o=>o.store_id===s.id&&o.is_on).length})),
        stats:{ scans:Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([spot,count])=>({spot,count})),
          scans_today: db.scans.filter(x=>new Date(new Date(x.at).getTime()+9*3600e3).toISOString().slice(0,10)===todayKST()).length,
          claims: db.claims.length, used: db.claims.filter(c=>c.used_at).length } });
    },
    adminSaveStore(pw,p){
      if(!isAdmin(pw)) return err('admin_failed');
      if(!String(p.name||'').trim()) return err('name_required');
      const code = String(p.code||'').trim().toLowerCase(), pin = String(p.pin||'');
      if(!/^[a-z0-9_-]{3,30}$/.test(code)) return err('bad_code');
      if(pin && pin.length<4) return err('pin_short');
      if(db.stores.some(s=>s.code===code && s.id!==+p.id)) return err('code_taken');
      const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
      const fields = {code, name:String(p.name).trim().slice(0,40), category:p.category||'기타', area:p.area||'기타', address:p.address||'', hours:p.hours||'', intro:p.intro||'', map_url:p.map_url||'', emoji:p.emoji||'🏪', active: p.active!==false, lat:num(p.lat), lng:num(p.lng)};
      if(!p.id){ if(!pin) return err('pin_short'); const s={id:++db.seq, pin, fail:0, locked_until:0, ...fields}; db.stores.push(s); save(); return ok({id:s.id}); }
      const s = st(+p.id); if(!s) return err('not_found'); Object.assign(s, fields); if(pin){ s.pin=pin; s.fail=0; s.locked_until=0; } save(); return ok({id:s.id});
    },
    adminDeleteStore(pw,id){ if(!isAdmin(pw)) return err('admin_failed'); const oids=db.offers.filter(o=>o.store_id===id).map(o=>o.id);
      db.stores=db.stores.filter(s=>s.id!==id); db.offers=db.offers.filter(o=>o.store_id!==id); db.claims=db.claims.filter(c=>!oids.includes(c.offer_id)); save(); return ok(); },
    adminSetNotice(pw,t){ if(!isAdmin(pw)) return err('admin_failed'); db.notice=String(t||'').slice(0,200); save(); return ok(); },
    reset(){ db = seed(); save(); }
  };
})();

  // 일산동구·일산서구를 대략 감싸는 네모 범위 (경계 근처는 조금 넓게 잡힘)
  BOX: {s:37.625, n:37.735, w:126.68, e:126.87},
  inIlsan(p){ return p && p.lat >= Geo.BOX.s && p.lat <= Geo.BOX.n && p.lng >= Geo.BOX.w && p.lng <= Geo.BOX.e; },
  get(){
    return new Promise(res => {
      if(!navigator.geolocation) return res({error:'unsupported'});
      navigator.geolocation.getCurrentPosition(
        pos => { Geo.last = {lat:pos.coords.latitude, lng:pos.coords.longitude, at:Date.now()}; res(Geo.last); },
        err => res({error: err && err.code === 1 ? 'denied' : 'fail'}),
        {enableHighAccuracy:true, timeout:12000, maximumAge:120000});
    });
  },
  meters(a, b){
    const R = 6371000, r = x => x*Math.PI/180;
    const dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
    const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  },
  label(store){
    if(!Geo.last || store.lat == null || store.lng == null) return '';
    const m = Geo.meters(Geo.last, store);
    return m < 1000 ? `${Math.round(m/10)*10}m` : `${(m/1000).toFixed(1)}km`;
  }
};

/* ---------- 지도 도구 (Leaflet, 필요할 때만 불러옴) ---------- */
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(loadLeaflet.p) return loadLeaflet.p;
  loadLeaflet.p = new Promise((res, rej) => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(l);
    const sc = document.createElement('script'); sc.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    sc.onload = () => res(); sc.onerror = () => { loadLeaflet.p = null; rej(new Error('leaflet')); };
    document.head.appendChild(sc);
  });
  return loadLeaflet.p;
}

              <button class="btn ghost sm" data-edit="${o.id}">수정</button>
              <button class="btn danger sm" data-del="${o.id}">삭제</button></div>
          </div>`; }).join('') : `<div class="empty">아직 만든 혜택이 없어요.<br>위의 '새 혜택 만들기'로 첫 쿠폰을 만들어보세요.</div>`}

        <details class="box" style="margin-top:22px"><summary>가게 소개·영업시간 수정</summary>
          <label class="f">가게 소개</label><textarea class="in" id="s-intro" maxlength="300">${esc(store.intro)}</textarea>
          <label class="f">영업시간</label><input class="in" id="s-hours" maxlength="100" value="${esc(store.hours)}" placeholder="예) 10:00–21:00 (월 휴무)">
          <button class="btn" id="s-save">저장</button>
          <p class="hint">가게 이름·주소·업종 변경은 와투두 담당자에게 요청해주세요.</p></details>

        <div class="section-t">최근 쿠폰 기록</div>
        ${recent.length ? recent.map(r=>`<div class="rec"><div>${esc(r.title)}<br><small class="code">${esc(r.code)}</small></div>
          <div style="text-align:right">${r.used_at?`<span class="tag-ok">사용 완료</span><br><small>${fmtDate(r.used_at)}</small>`:`<span class="tag-wait">받음 (미사용)</span><br><small>${fmtDate(r.claimed_at)}</small>`}</div></div>`).join('')
          : `<div class="empty" style="padding:20px">아직 기록이 없어요</div>`}
        <div class="foot"><button class="linkbtn" id="o-ref">↻ 새로고침</button> · 30초마다 자동 새로고침</div>
      </div>`;
    if(keep) window.scrollTo(0,y);
    const cr = Owner.cred();
    const after = async (r, okMsg) => { if(r && r.ok){ if(okMsg) toast(okMsg); } else toast(errMsg(r)); if(await Owner.load()) Owner.paint(true); };
    $('#o-out').onclick = () => { SS.del('il_owner'); S.ownerData = null; Owner.renderLogin(); };
    $('#o-ref').onclick = async () => { if(await Owner.load()) { Owner.paint(true); toast('최신 상태예요'); } };
    $('#o-new').onclick = () => Owner.openForm();
    document.querySelectorAll('[data-tg]').forEach(b => b.onclick = async () => {
      const o = offers.find(x=>x.id===+b.dataset.tg); const on = !o.is_on;
      b.classList.toggle('is-on', on); b.disabled = true;
      after(await API.ownerToggle(cr.code, cr.pin, o.id, on), on ? '켰어요 — 손님 화면에 보여요' : '껐어요 — 손님 화면에서 숨겨졌어요');
    });
    document.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
      const o = offers.find(x=>x.id===+b.dataset.add);
      after(await API.ownerSaveOffer(cr.code, cr.pin, {id:o.id, kind:o.kind, title:o.title, detail:o.detail, ends_at:o.ends_at||'', total_qty:o.total_qty + +b.dataset.n}), `수량을 ${b.dataset.n}개 늘렸어요`);
    });
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => Owner.openForm(offers.find(x=>x.id===+b.dataset.edit)));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if(!b.dataset.sure){ b.dataset.sure = 1; b.textContent = '한 번 더 누르면 삭제'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.sure; b.textContent='삭제'; } }, 3000); return; }
      after(await API.ownerDeleteOffer(cr.code, cr.pin, +b.dataset.del), '삭제했어요');
    });
    $('#s-save').onclick = async () => after(await API.ownerSaveStore(cr.code, cr.pin, {intro:$('#s-intro').value, hours:$('#s-hours').value}), '저장했어요');
  },
  openForm(o){
    const isNew = !o; o = o || {kind:'coupon', title:'', detail:'', total_qty:10, ends_at:''};
    let kind = o.kind;
    openSheet(`
      <h2 class="display">${isNew?'새 혜택 만들기':'혜택 수정'}</h2>
      <label class="f">종류</label>
      <div class="seg"><button data-k="coupon" class="${kind==='coupon'?'on':''}">🎟 쿠폰 (증정·1+1)</button><button data-k="discount" class="${kind==='discount'?'on':''}">％ 할인</button></div>
      <label class="f">혜택 이름</label><input class="in" id="f-title" maxlength="60" value="${esc(o.title)}" placeholder="예) 아메리카노 1+1">
      <label class="f">조건·설명 <span style="font-weight:400;color:var(--sub)">(선택)</span></label>
      <textarea class="in" id="f-detail" maxlength="300" placeholder="예) 매장 이용 시 · 1인 1회 · 다른 할인과 중복 불가">${esc(o.detail)}</textarea>
      <div class="grid2">
        <div><label class="f">선착순 수량</label><input class="in" id="f-qty" type="number" min="${o.claimed||0}" inputmode="numeric" value="${o.total_qty}">
          ${o.claimed?`<div class="hint">이미 ${o.claimed}개 받아감</div>`:''}</div>
        <div><label class="f">마감일 <span style="font-weight:400;color:var(--sub)">(선택)</span></label><input class="in" id="f-end" type="date" value="${esc(o.ends_at||'')}"></div>
      </div>
      ${isNew?`<label class="check"><input type="checkbox" id="f-on" checked> 저장하면 바로 켜기 (손님 화면에 노출)</label>`:''}
      <div class="err" id="f-err"></div>
      <button class="btn pop" id="f-save">저장</button>
      <button class="btn ghost" onclick="closeSheet()">취소</button>`);
    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { kind = b.dataset.k; document.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on', x===b)); });
    $('#f-save').onclick = async () => {
      const cr = Owner.cred();
      const p = {kind, title:$('#f-title').value.trim(), detail:$('#f-detail').value.trim(), total_qty:parseInt($('#f-qty').value)||0, ends_at:$('#f-end').value||''};
      if(!p.title) return $('#f-err').textContent = ERR.title_required;
      if(p.total_qty < 1) return $('#f-err').textContent = '수량은 1개 이상이어야 해요';
      if(isNew) p.is_on = $('#f-on').checked; else p.id = o.id;
      $('#f-save').disabled = true;
      const r = await API.ownerSaveOffer(cr.code, cr.pin, p);
      if(r && r.ok){ closeSheet(); toast(isNew ? (p.is_on?'혜택을 만들고 켰어요':'혜택을 만들었어요 (꺼진 상태)') : '수정했어요'); if(await Owner.load()) Owner.paint(true); }
      else { $('#f-err').textContent = errMsg(r); $('#f-save').disabled = false; }
    };
  }
};

/* =====================================================================
   관리자용 (#admin) — 와투두 운영자 전용
   ===================================================================== */
const Admin = {
  pw(){ return SS.get('il_admin'); },
  async render(){
    if(!Admin.pw()) return Admin.renderLogin();
    $('#app').innerHTML = '<div class="spin">불러오는 중…</div>';
    if(await Admin.load()) Admin.paint();
  },
  async load(){
    const r = await API.adminData(Admin.pw());
    if(!r || !r.ok){ if(r && r.error==='network'){ toast(errMsg(r)); return !!S.adminData; } SS.del('il_admin'); Admin.renderLogin(errMsg(r)); return false; }
    S.adminData = r; return true;
  },
  renderLogin(msg){
    $('#app').innerHTML = `<div class="wrap"><div class="gate">${MOLE(70)}
      <h1 class="display">와투두 관리자</h1><p>가게 등록, 두더지 출몰 안내, QR 만들기</p>
      ${LIVE?'':'<div class="banner demo"><div class="ico">🧪</div><div><strong>체험 모드</strong>관리자 비밀번호: <b>demo</b></div></div>'}
      <label class="f">관리자 비밀번호</label><input class="in" id="a-pw" type="password" autocomplete="current-password">
      <div class="err" id="a-err">${esc(msg||'')}</div><button class="btn" id="a-go">들어가기</button>
      <div class="foot"><a href="#">← 손님 화면으로</a></div></div></div>`;
    const go = async () => { const pw = $('#a-pw').value; $('#a-go').disabled = true; const r = await API.adminData(pw);
      if(r && r.ok){ SS.set('il_admin', pw); S.adminData = r; Admin.paint(); } else { $('#a-err').textContent = errMsg(r); $('#a-go').disabled = false; } };
    $('#a-go').onclick = go; $('#a-pw').onkeydown = e => { if(e.key==='Enter') go(); };
  },
  paint(){
    const {stores, notice, stats} = S.adminData;
    $('#app').innerHTML = `
      <div class="top"><div class="brand">${MOLE(30)}<span class="display" style="font-size:18px">와투두 관리자</span></div>
        <button class="pill" id="a-out">로그아웃</button></div>
      <div class="wrap">
        ${demoBanner()}
        <div class="stats">
          <div class="stat"><b>${stats.scans_today}</b><span>오늘 QR 스캔</span></div>
          <div class="stat"><b>${stats.claims}</b><span>받은 쿠폰</span></div>
          <div class="stat"><b>${stats.used}</b><span>사용된 쿠폰</span></div></div>
        <details class="box"><summary>QR 스캔 위치별 (누적)</summary>
          ${stats.scans.length ? stats.scans.map(s=>`<div class="rec"><span>${esc(s.spot)}</span><b>${s.count}</b></div>`).join('') : '<p class="hint">아직 스캔 기록이 없어요</p>'}</details>

        <div class="section-t">🐹 두더지 출몰 안내</div>
        <textarea class="in" id="a-notice" maxlength="200" placeholder="예) 11/29(토) 오후 3~5시 라페스타 광장">${esc(notice||'')}</textarea>
        <div class="hint">손님 화면 맨 위에 보여요. 비우고 저장하면 숨겨져요.</div>
        <button class="btn" id="a-nsave">안내 저장</button>

        <div class="section-t">📱 인형탈용 QR 만들기</div>
        <label class="f">출몰 위치 이름 (영어·숫자)</label>
        <input class="in" id="a-spot" placeholder="예) lafesta, jungbalsan, juyeop">
        <div class="hint">위치마다 QR을 따로 만들면, 어디서 몇 명이 스캔했는지 위 통계에 나와요.</div>
        <button class="btn ghost" id="a-qr">QR 만들기</button>
        <div id="a-qrout"></div>

        <div class="row-between"><div class="section-t">🏪 제휴 가게 ${stores.length}곳</div><button class="btn pop sm" id="a-new">＋ 가게 등록</button></div>
        ${stores.map(s=>`<button class="card" data-st="${s.id}" style="margin-top:8px">${catIcon(s.category,54,26,16)}
          <div class="info"><div class="name">${esc(s.name)}</div><div class="meta">${esc(s.category)} · ${esc(s.area)} · 아이디 <b>${esc(s.code)}</b></div>
          <div class="nodeal">혜택 ${s.offer_count}개 (켜짐 ${s.on_count})${s.active?'':' · <b style="color:var(--warn)">숨김</b>'}${s.lat==null?' · <b style="color:var(--pop-ink)">지도 위치 없음</b>':''}</div></div></button>`).join('')}
      </div>`;
    $('#a-out').onclick = () => { SS.del('il_admin'); S.adminData = null; Admin.renderLogin(); };
    $('#a-nsave').onclick = async () => { const r = await API.adminSetNotice(Admin.pw(), $('#a-notice').value.trim()); toast(r&&r.ok?'저장했어요':errMsg(r)); S.data = null; };
    $('#a-qr').onclick = () => Admin.makeQR($('#a-spot').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g,''));
    $('#a-new').onclick = () => Admin.openForm();
    document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => Admin.openForm(stores.find(s=>s.id===+b.dataset.st)));
  },
  makeQR(spot){
    if(!spot) return toast('위치 이름을 영어로 적어주세요');
    const url = location.origin + location.pathname + '?src=mascot&spot=' + encodeURIComponent(spot);
    const out = $('#a-qrout');
    out.innerHTML = `<div class="qrbox"><div id="qrc"></div><code>${esc(url)}</code><div id="qrdl"></div></div>`;
    const draw = () => {
      new QRCode($('#qrc'), {text:url, width:240, height:240, colorDark:'#3A2A22', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
      setTimeout(() => {
        const c = $('#qrc canvas'); if(!c) return;
        // 인쇄용: 흰 여백(QR 인식에 필요) + 아래에 위치 이름
        const S = 720, pad = 72, out = document.createElement('canvas');
        out.width = S; out.height = S + 70;
        const g = out.getContext('2d');
        g.fillStyle = '#ffffff'; g.fillRect(0, 0, out.width, out.height);
        g.imageSmoothingEnabled = false;
        g.drawImage(c, pad, pad, S - pad*2, S - pad*2);
        g.fillStyle = '#3A2A22'; g.font = 'bold 34px sans-serif'; g.textAlign = 'center';
        g.fillText('WOTODO · ' + spot, S/2, S + 20);
        const dataUrl = out.toDataURL('image/png'), fname = `wotodo-ilsan-qr-${spot}.png`;
        // 화면에 이미지로 보여주기 → 아이폰에서 길게 눌러 '사진에 저장' 가능
        $('#qrc').innerHTML = `<img src="${dataUrl}" alt="QR" style="width:240px;height:auto;display:block;-webkit-touch-callout:default">`;
        $('#qrdl').innerHTML = `<button class="btn sm" id="qr-save">QR 이미지 저장</button><p class="hint" style="text-align:center;margin-top:6px">저장이 안 되면 QR 그림을 길게 눌러 '사진 앱에 저장'을 고르세요.</p>`;
        $('#qr-save').onclick = () => out.toBlob(async blob => {
          if(!blob) return toast('이미지를 만들지 못했어요');
          const file = new File([blob], fname, {type:'image/png'});
          // 휴대폰: 공유창 → '이미지 저장'
          if(navigator.canShare && navigator.canShare({files:[file]})){
            try { await navigator.share({files:[file]}); return; }
            catch(e){ if(e && e.name === 'AbortError') return; }
          }
          // 컴퓨터: 파일로 내려받기
          const u = URL.createObjectURL(blob), a = document.createElement('a');
          a.href = u; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(u), 4000);
        }, 'image/png');
      }, 300);
    };
    if(window.QRCode) return draw();
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload = draw; sc.onerror = () => { $('#qrc').innerHTML = '<p class="hint">QR 도구를 불러오지 못했어요. 위 주소로 QR 생성 사이트에서 만들어주세요.</p>'; };
    document.head.appendChild(sc);
  },
  openForm(s){
    const isNew = !s; s = s || {code:'', name:'', emoji:'🏪', category:'카페', area:AREAS[0], address:'', hours:'', intro:'', map_url:'', active:true};
    openSheet(`
      <h2 class="display">${isNew?'가게 등록':'가게 수정'}</h2>
      <div class="grid2">
        <div><label class="f">가게 아이디</label><input class="in" id="b-code" autocapitalize="off" value="${esc(s.code)}" placeholder="cafe01"></div>
        <div><label class="f">PIN ${isNew?'':'<span style="font-weight:400;color:var(--sub)">(바꿀 때만)</span>'}</label><input class="in" id="b-pin" inputmode="numeric" placeholder="${isNew?'6자리 권장':'그대로 두기'}"></div>
      </div>
      <div class="hint">사장님께 아이디와 PIN을 전달하세요. PIN은 쿠폰 사용 처리에도 쓰여요.</div>
      <label class="f" for="b-name">가게 이름</label><input class="in" id="b-name" maxlength="40" value="${esc(s.name)}">
      <div class="grid2">
        <div><label class="f">업종</label><select class="in" id="b-cat">${CATS.map(c=>`<option ${c===s.category?'selected':''}>${c}</option>`).join('')}</select></div>
        <div><label class="f">동네 구역</label><select class="in" id="b-area">${AREAS.map(a=>`<option ${a===s.area?'selected':''}>${a}</option>`).join('')}</select></div>
      </div>
      <label class="f">주소</label><input class="in" id="b-addr" maxlength="120" value="${esc(s.address)}">
      <label class="f">지도 위치 <span style="font-weight:400;color:var(--sub)">(손님 지도에 핀으로 나와요)</span></label>
      <div id="b-mapbox" style="height:230px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);background:#EEE5D5"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px">
        <div class="hint" id="b-pos" style="margin:0"></div>
        <button type="button" class="btn ghost sm" id="b-pos-clear">위치 지우기</button>
      </div>
      <label class="f">영업시간</label><input class="in" id="b-hours" maxlength="100" value="${esc(s.hours)}">
      <label class="f">소개</label><textarea class="in" id="b-intro" maxlength="300">${esc(s.intro)}</textarea>
      <label class="f">네이버 지도 링크</label><input class="in" id="b-map" maxlength="300" value="${esc(s.map_url)}" placeholder="https://naver.me/...">
      <label class="check"><input type="checkbox" id="b-active" ${s.active?'checked':''}> 손님 화면에 보이기</label>
      <div class="err" id="b-err"></div>
      <button class="btn pop" id="b-save">저장</button>
      ${isNew?'':'<button class="btn danger" id="b-del">가게 삭제</button>'}
      <button class="btn ghost" onclick="closeSheet()">취소</button>`);
    // 지도에서 가게 위치 찍기
    let pos = (s.lat != null && s.lng != null) ? {lat:+s.lat, lng:+s.lng} : null, pmap = null, pmark = null;
    const showPos = () => { $('#b-pos').textContent = pos ? `위치 저장됨 (${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}) · 다시 누르면 옮겨져요` : '지도를 눌러 가게 위치를 찍어주세요 (확대하면 더 정확해요)'; };
    showPos();
    $('#b-pos-clear').onclick = () => { pos = null; if(pmark){ pmark.remove(); pmark = null; } showPos(); };
    loadLeaflet().then(() => {
      if(!document.getElementById('b-mapbox')) return;
      pmap = L.map('b-mapbox', {zoomControl:true}).setView(pos ? [pos.lat, pos.lng] : ILSAN_CENTER, pos ? 17 : 14);
      mapTiles().addTo(pmap);
      const place = () => { if(pmark) pmark.remove(); pmark = L.marker([pos.lat, pos.lng], {icon:L.divIcon({className:'', html:`<div class="mpin sel"><i>${MOLE(30)}</i>여기</div>`, iconSize:[0,0]})}).addTo(pmap); };
      if(pos) place();
      pmap.on('click', e => { pos = {lat:e.latlng.lat, lng:e.latlng.lng}; place(); showPos(); });
      setTimeout(() => pmap.invalidateSize(), 300);
    }).catch(() => { $('#b-mapbox').innerHTML = '<p class="hint" style="padding:16px">지도를 불러오지 못했어요. 인터넷 연결을 확인해주세요.</p>'; });
    $('#b-save').onclick = async () => {
      const p = {id:s.id||'', code:$('#b-code').value.trim().toLowerCase(), pin:$('#b-pin').value.trim(), emoji:s.emoji||'', name:$('#b-name').value.trim(),
        category:$('#b-cat').value, area:$('#b-area').value, address:$('#b-addr').value.trim(), hours:$('#b-hours').value.trim(), intro:$('#b-intro').value.trim(), map_url:$('#b-map').value.trim(), active:$('#b-active').checked,
        lat: pos ? pos.lat.toFixed(6) : '', lng: pos ? pos.lng.toFixed(6) : ''};
      $('#b-save').disabled = true;
      const r = await API.adminSaveStore(Admin.pw(), p);
      if(r && r.ok){ closeSheet(); toast(isNew?'가게를 등록했어요':'저장했어요'); S.data = null; if(await Admin.load()) Admin.paint(); }
      else { $('#b-err').textContent = errMsg(r); $('#b-save').disabled = false; }
    };
    const del = $('#b-del');
    if(del) del.onclick = async () => {
      if(!del.dataset.sure){ del.dataset.sure = 1; del.textContent = '혜택·쿠폰 기록까지 모두 지워져요. 한 번 더 누르면 삭제'; return; }
      const r = await API.adminDeleteStore(Admin.pw(), s.id);
      closeSheet(); toast(r&&r.ok?'삭제했어요':errMsg(r)); S.data = null; if(await Admin.load()) Admin.paint();
    };
  }
};

route();
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
